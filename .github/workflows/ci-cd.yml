name: AI Product Manager CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc g++ libgl1

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backend tests
        env:
          PYTHONPATH: .
        run: |
          pytest -q


  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install frontend dependencies
        run: |
          npm ci

      - name: Run frontend lint
        run: |
          npm run lint

      - name: Build frontend
        run: |
          npm run build

      - name: Verify frontend build
        run: |
          test -d dist
          echo "Frontend build completed successfully."


  ci-success:
    name: CI/CD Pipeline Success
    runs-on: ubuntu-latest

    needs:
      - backend-test
      - frontend-build

    steps:

      - name: Pipeline completed successfully
        run: |
          echo "=========================================="
          echo " AI PRODUCT MANAGER CI/CD"
          echo "=========================================="
          echo "Backend tests: PASSED"
          echo "Frontend lint: PASSED"
          echo "Frontend build: PASSED"
          echo "Docker: NOT USED"
          echo "=========================================="
